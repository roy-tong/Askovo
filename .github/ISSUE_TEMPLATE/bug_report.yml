name: Bug 报告
description: 报告可复现的 CLI、Skill、MCP 或打包问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请只使用合成数据。不要上传真实用户内容、平台导出、凭据、Cookie 或个人信息。安全漏洞请走私密漏洞报告。
  - type: input
    id: version
    attributes:
      label: askovo 版本
      description: "`askovo --version` 的输出"
      placeholder: "askovo 2.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python 版本，以及源码/editable/wheel 安装方式
      placeholder: "macOS 15, Python 3.12, wheel"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 提供完整命令和必要的合成输入
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包含错误输出和退出码
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已移除真实用户数据、个人信息和凭据
          required: true
        - label: 我已阅读故障排查文档并尝试现有版本
          required: true
