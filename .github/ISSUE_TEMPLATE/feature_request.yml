name: 功能或研究能力建议
description: 提出一个边界清晰、可验证的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户、场景和当前缺口，不先限定实现方式
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为
      description: 给出示例命令、输入和预期输出
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案与非目标
  - type: dropdown
    id: surface
    attributes:
      label: 影响入口
      options:
        - CLI / Skill / MCP 三者共有行为
        - Agent Skill
        - MCP
        - 文档与示例
        - 打包与发布
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 该建议不会新增按领域分叉的 CLI/Skill，也不会绕过 blocked connector 或平台授权
          required: true
