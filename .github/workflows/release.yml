name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        run: |
          case "${GITHUB_REF}" in
            refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
            refs/heads/release/*)
              TAG="${GITHUB_REF#refs/heads/release/}"
              case "${TAG}" in v*) ;; *) TAG="v${TAG}" ;; esac
              ;;
            *) echo "unexpected ref: ${GITHUB_REF}" >&2; exit 2 ;;
          esac
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "building release for tag: ${TAG}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check out the release tag
        run: |
          TARGET_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}" 2>/dev/null || true)"
          if [ -z "${TARGET_SHA}" ]; then
            TARGET_SHA="$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)"
          fi
          if [ -z "${TARGET_SHA}" ]; then
            echo "tag ${TAG} not found locally or on origin" >&2
            exit 2
          fi
          git checkout --detach "${TARGET_SHA}"
          echo "HEAD is now: $(git rev-parse HEAD) (tag ${TAG} -> ${TARGET_SHA})"
      - name: Record failure diagnostics
        if: failure()
        run: |
          git config user.name "askovo-release-bot"
          git config user.email "release-bot@askovo.invalid"
          git checkout -B release-diagnostics || true
          {
            echo "run: ${GITHUB_RUN_ID} ref: ${GITHUB_REF} TAG: ${TAG:-<unset>}"
            git --version
            git remote -v
            git tag -l | sed -n '1,30p'
          } > diagnostics.txt
          git add diagnostics.txt
          git commit -m "diagnostics for release run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:refs/heads/release-diagnostics --force || true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Build wheel and sdist
        run: |
          python3 -m pip install --upgrade pip build twine
          python3 -m build
      - name: Twine check
        run: python3 -m twine check dist/*
      - name: Isolated wheel smoke
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/askovo --version
          /tmp/smoke/bin/askovo doctor
          cd /tmp && /tmp/smoke/bin/askovo demo
      - name: Extract release notes from CHANGELOG
        run: |
          python3 - <<'PY'
          import pathlib, re
          version = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = r"^## " + re.escape(version) + r" [^\n]*\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, text, re.M | re.S)
          assert match, "missing CHANGELOG section for " + version
          header = "# Askovo v" + version + "\n\n"
          pathlib.Path("/tmp/notes.md").write_text(header + match.group(1).strip() + "\n", encoding="utf-8")
          PY
      - name: Append asset checksums
        run: |
          cd dist && sha256sum *.whl *.tar.gz > /tmp/checksums.txt && cd ..
          {
            echo ""
            echo "## Checksums"
            echo ""
            echo '```'
            cat /tmp/checksums.txt
            echo '```'
          } >> /tmp/notes.md
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Askovo ${TAG#v}" --notes-file /tmp/notes.md dist/*.whl dist/*.tar.gz
          fi

  # ── PyPI: `pipx install askovo` ──
  # Uses PyPI trusted publishing (OIDC): no API token to store or leak.
  # One-time setup on PyPI (account owner): Publishing → Add a pending publisher
  #   PyPI project name: askovo
  #   owner: roy-tong · repository: Askovo · workflow: release.yml
  #   environment: (leave empty)
  pypi-publish:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      id-token: write
    steps:
      # On a tag push github.ref is the tag itself; on a release/* branch it is
      # the branch. Both carry the VERSION file this job publishes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - name: Skip if this version is already live on PyPI (idempotent re-runs)
        run: |
          VER="$(cat VERSION)"
          LIVE="$(curl -sf "https://pypi.org/pypi/askovo/json" | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo none)"
          echo "local=$VER live=$LIVE"
          if [[ "$VER" == "$LIVE" ]]; then
            echo "askovo $VER already live on PyPI — skipping publish"
            echo "pypi_skip=true" >> "$GITHUB_ENV"
          else
            echo "pypi_skip=false" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ env.pypi_skip != 'true' }}
        with:
          python-version: "3.9"
      - name: Build wheel and sdist
        if: ${{ env.pypi_skip != 'true' }}
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build
      - name: Publish askovo to PyPI
        if: ${{ env.pypi_skip != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
