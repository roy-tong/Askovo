name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        run: |
          case "${GITHUB_REF}" in
            refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
            refs/heads/release/*) TAG="v${GITHUB_REF#refs/heads/release/}" ;;
            *) echo "unexpected ref: ${GITHUB_REF}" >&2; exit 2 ;;
          esac
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "building release for tag: ${TAG}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check out the release tag
        run: |
          git checkout --detach "${TAG}" || {
            echo "tag ${TAG} is not present after full fetch" >&2
            git tag -l | sed -n '1,20p' >&2
            exit 2
          }
          echo "HEAD is now: $(git rev-parse HEAD) ($(git describe --tags --exact-match 2>/dev/null || echo '?'))"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Build wheel and sdist
        run: |
          python3 -m pip install --upgrade pip build twine
          python3 -m build
      - name: Twine check
        run: python3 -m twine check dist/*
      - name: Isolated wheel smoke
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/askovo --version
          /tmp/smoke/bin/askovo doctor
          cd /tmp && /tmp/smoke/bin/askovo demo
      - name: Extract release notes from CHANGELOG
        run: |
          python3 - <<'PY'
          import pathlib, re
          version = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = r"^## " + re.escape(version) + r" .*$\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, text, re.M | re.S)
          assert match, "missing CHANGELOG section for " + version
          header = "# Askovo v" + version + "\n\n"
          pathlib.Path("/tmp/notes.md").write_text(header + match.group(1).strip() + "\n", encoding="utf-8")
          PY
      - name: Append asset checksums
        run: |
          cd dist && sha256sum *.whl *.tar.gz > /tmp/checksums.txt && cd ..
          {
            echo ""
            echo "## Checksums"
            echo ""
            echo '```'
            cat /tmp/checksums.txt
            echo '```'
          } >> /tmp/notes.md
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Askovo ${TAG#v}" --notes-file /tmp/notes.md dist/*.whl dist/*.tar.gz
          fi
