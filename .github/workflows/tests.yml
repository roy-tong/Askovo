name: tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 skills/askovo/scripts/askovo.py check examples/sample-study --stage full
      - name: Router and platform smoke
        run: |
          python3 skills/askovo/scripts/askovo.py route "手机相机夜景和续航" --json > /tmp/route.json
          python3 -c 'import json; assert json.load(open("/tmp/route.json"))["domain"] == "mobile"'
          python3 skills/askovo/scripts/askovo.py platforms "家用摄像头夜间告警" --domain hardware --json > /tmp/platforms.json
          python3 -c 'import json; d=json.load(open("/tmp/platforms.json")); assert any(x["id"] == "reddit" for x in d["recommended"])'
          python3 skills/askovo/scripts/askovo.py doctor
      - name: Version is single-sourced
        run: |
          test "$(cat VERSION)" = "$(python3 skills/askovo/scripts/askovo.py --version | awk '{print $2}')"
          test "$(cat VERSION)" = "$(python3 -c 'import askovo; print(askovo.__version__)')"
          ! grep -qE 'askovo [0-9]+\.[0-9]+' skills/askovo/assets/study-template/study.json
          ! grep -qE 'SERVER_VERSION = "[0-9]' skills/askovo/scripts/askovo_mcp.py
      - name: Packaging smoke
        run: |
          python3 -m pip install -e .
          askovo --version
          askovo doctor
          askovo demo
