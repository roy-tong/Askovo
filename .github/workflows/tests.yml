name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Optional test dependencies
        run: python3 -m pip install 'openpyxl>=3.1,<4' 'PyYAML>=6,<7'
      - name: Unit and regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Synthetic sample gate
        run: python3 skills/askovo/scripts/askovo.py check examples/sample-study --stage full
      - name: Router and platform smoke
        run: |
          python3 skills/askovo/scripts/askovo.py route "手机相机夜景和续航" --json > /tmp/route.json
          python3 -c 'import json; assert json.load(open("/tmp/route.json"))["domain"] == "mobile"'
          python3 skills/askovo/scripts/askovo.py route "SaaS retention churn" --json > /tmp/route-en.json
          python3 -c 'import json; assert json.load(open("/tmp/route-en.json"))["domain"] == "software"'
          python3 skills/askovo/scripts/askovo.py platforms "家用摄像头夜间告警" --domain hardware --json > /tmp/platforms.json
          python3 -c 'import json; d=json.load(open("/tmp/platforms.json")); assert any(x["id"] == "reddit" for x in d["recommended"])'
          python3 skills/askovo/scripts/askovo.py doctor
      - name: Version is single-sourced
        run: |
          test "$(cat VERSION)" = "$(python3 skills/askovo/scripts/askovo.py --version | awk '{print $2}')"
          test "$(cat VERSION)" = "$(python3 -c 'import askovo; print(askovo.__version__)')"
          test "$(cat VERSION)" = "$(python3 -c 'import json; print(json.load(open("examples/sample-study/study.json"))["method_version"])')"
          ! grep -qE 'askovo [0-9]+\.[0-9]+' skills/askovo/assets/study-template/study.json
          ! grep -qE 'SERVER_VERSION = "[0-9]' skills/askovo/scripts/askovo_mcp.py

  packaging:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and inspect distributions
        run: |
          python3 -m pip install build twine
          python3 -m build
          python3 -m twine check dist/*
      - name: Install wheel outside the source tree
        run: |
          python3 -m venv /tmp/askovo-wheel-venv
          /tmp/askovo-wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/askovo-wheel-venv/bin/askovo --version
          /tmp/askovo-wheel-venv/bin/askovo doctor
          /tmp/askovo-wheel-venv/bin/askovo demo
          /tmp/askovo-wheel-venv/bin/askovo --help > /tmp/askovo-help.txt
          grep -q 'queue' /tmp/askovo-help.txt
          /tmp/askovo-wheel-venv/bin/askovo-mcp --tools > /tmp/askovo-tools.json
          python3 -c 'import json; d=json.load(open("/tmp/askovo-tools.json")); assert "askovo_plan" in {tool["name"] for tool in d["tools"]}'
          /tmp/askovo-wheel-venv/bin/python -c 'import askovo; from pathlib import Path; assert not (Path(askovo.__file__).parent / "runtime/scripts/mcp_server.py").exists()'
