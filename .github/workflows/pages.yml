name: pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/seo_check.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Failure-injection self-test (the gate must be able to fail)
        run: python3 scripts/seo_check.py --selftest
      - name: Sitemap, canonical, links, JSON-LD and review dates
        run: python3 scripts/seo_check.py

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # The repository had no Pages site configured, so configure-pages
          # failed before upload. Let the action create the workflow Pages site
          # using the workflow token; no other repository setting is changed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
