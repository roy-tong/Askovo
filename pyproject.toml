[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askovo"
dynamic = ["version"]
description = "askovo — evidence-led product research with the SURE engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Roy.Tong" }]
dependencies = []

[project.scripts]
askovo = "askovo.cli:main"
askovo-mcp = "askovo.mcp:main"

[tool.setuptools]
packages = ["askovo"]

[tool.setuptools.dynamic]
version = { attr = "askovo.__version__" }
