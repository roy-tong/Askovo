[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "askovo"
dynamic = ["version"]
description = "Askovo — scene-to-business reasoning with auditable evidence for PM, research, market, requirements, and business analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roy.Tong" }]
keywords = ["product-management", "user-research", "user-operations", "product-discovery", "agent-skill", "mcp", "evidence", "jtbd"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/roy-tong/askovo"
Repository = "https://github.com/roy-tong/askovo"
Documentation = "https://github.com/roy-tong/askovo/blob/main/docs/README.md"
Changelog = "https://github.com/roy-tong/askovo/blob/main/CHANGELOG.md"
Issues = "https://github.com/roy-tong/askovo/issues"
Security = "https://github.com/roy-tong/askovo/security"

[project.scripts]
askovo = "askovo.cli:main"
askovo-mcp = "askovo.mcp:main"

[tool.setuptools]
packages = ["askovo"]

[tool.setuptools.dynamic]
version = { attr = "askovo.__version__" }
